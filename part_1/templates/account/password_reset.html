{% extends '_base.html' %}
{% load tailwind_filters  %}
{% block content %}
<div class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-sm">
        <h2 class="mt-10 text-center text-2xl/9 font-bold tracking-tight text-gray-900">Reset account password</h2>
    </div>

    <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-sm">
        <form method="POST" class="space-y-6">
            <div>
                <div class="mt-2">
                    {% csrf_token %}
                    {{ form|crispy }}
                </div>
            </div>
            <div>
                <button type="submit"
                    class="cursor-pointer flex w-full justify-center rounded-md bg-indigo-600 px-3 py-1.5 text-sm/6 font-semibold text-white shadow-xs hover:bg-indigo-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">Reset
                    Password</button>
            </div>
        </form>
        <div>
            <div class="flex items-center justify-between">
                <p class="text-center text-sm/6 text-gray-500">
                    Not a member?
                    <a href="{% url 'account_signup' %}"
                        class="font-semibold text-indigo-600 hover:text-indigo-500">Signup</a>
                </p>
                or
                <div class="text-sm">
                    <a href="{% url 'account_reset_password' %}"
                        class="font-semibold text-indigo-600 hover:text-indigo-500">Forgot
                        password?</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
