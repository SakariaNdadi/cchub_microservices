[project]
name = "monolith"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "celery>=5.5.3",
    "crispy-tailwind>=1.0.3",
    "django>=5.2.5",
    "django-cleanup>=9.0.0",
    "django-cotton>=2.1.3",
    "django-phonenumber-field[phonenumberslite]>=8.1.0",
    "djangorestframework>=3.16.1",
    "drf-extra-fields>=3.7.0",
    "pillow>=11.3.0",
    "psycopg[binary]>=3.2.9",
    "requests>=2.32.4",
]

[dependency-groups]
dev = [
    "django-browser-reload>=1.18.0",
    "ruff>=0.12.8",
]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "apps.py",
]
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = ["F","E","W","I","N","R"]
extend-ignore = ["F403"]

[format]
quote-style = "double"
indent-style = "tabs"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
python_files = ["test_*.py", "*_test.py", "tests.py","tests/"]
